<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recap Email Generator</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1>Recap Email Generator</h1>
    <button type="button" id="newProspect" class="btn btn-ghost">New Prospect</button>
  </header>

  <main class="layout">
    <form id="recapForm" class="form" autocomplete="off" novalidate>

      <section class="card">
        <label>Prospect first name<input name="prospect.firstName" placeholder="e.g. Mary"></label>

        <div class="field-label">Situation</div>
        <div class="segmented grid-2x2" role="radiogroup" aria-label="Situation">
          <label><input type="radio" name="situation" value="t65"><span>Turning 65</span></label>
          <label><input type="radio" name="situation" value="leavingEmployer"><span>Leaving employer coverage</span></label>
          <label><input type="radio" name="situation" value="stayingEmployer"><span>Staying on employer coverage</span></label>
          <label><input type="radio" name="situation" value="onMedicare"><span>Already on Medicare</span></label>
        </div>

        <div class="panel grid2" data-situation="onMedicare">
          <label>Current plan<input name="current.plan" placeholder="e.g. Humana Gold Plus HMO"></label>
          <label>Current monthly premium ($)<input name="current.premium" inputmode="decimal" placeholder="0"></label>
        </div>

        <label>In their words <span class="hint">optional, appears in the email</span>
          <textarea name="notes" rows="2" placeholder="e.g. Your mom battled breast cancer, and keeping Dr. Patel matters to you."></textarea>
        </label>
      </section>

      <section class="card" data-hide-when-staying>
        <h2>Main coverage</h2>
        <div class="segmented" role="radiogroup" aria-label="Main coverage">
          <label><input type="radio" name="main" value="mapd"><span>Medicare Advantage</span></label>
          <label><input type="radio" name="main" value="medsupp" checked><span>Medicare Supplement</span></label>
          <label><input type="radio" name="main" value="ancillary"><span>Ancillary</span></label>
        </div>

        <div class="panel grid3" data-main="mapd">
          <label>Carrier<input name="mapd.carrier" placeholder="Humana"></label>
          <label>Plan name<input name="mapd.planName" placeholder="Gold Plus HMO"></label>
          <label>Premium ($/mo)<input name="mapd.premium" inputmode="decimal" placeholder="0"></label>
        </div>

        <div class="panel grid3" data-main="medsupp">
          <label>Plan
            <select name="medsupp.plan">
              <option value="G">Plan G</option>
              <option value="N">Plan N</option>
            </select>
          </label>
          <label>Carrier<input name="medsupp.carrier" placeholder="AFLAC"></label>
          <label>Premium ($/mo)<input name="medsupp.premium" inputmode="decimal" placeholder="116.16"></label>
        </div>

        <div class="panel" data-main="mapd medsupp">
          <label class="narrow">Part B premium ($/mo)<input name="partBPremium" inputmode="decimal" id="partBPremium"></label>
        </div>
      </section>

      <section class="card">
        <h2>Products</h2>
        <div class="products">
          <div class="product" data-product="cancer">
            <label class="product-toggle"><input type="checkbox" name="anc.cancer.on"> Cancer</label>
            <div class="product-body grid2">
              <label>Benefit ($)<input name="anc.cancer.benefit" inputmode="decimal" placeholder="15000"></label>
              <label>Premium ($/mo)<input name="anc.cancer.premium" inputmode="decimal" placeholder="41.85"></label>
            </div>
          </div>

          <div class="product" data-product="heart">
            <label class="product-toggle"><input type="checkbox" name="anc.heart.on"> Heart Attack &amp; Stroke</label>
            <div class="product-body grid2">
              <label>Benefit ($)<input name="anc.heart.benefit" inputmode="decimal" placeholder="15000"></label>
              <label>Premium ($/mo)<input name="anc.heart.premium" inputmode="decimal" placeholder="42.65"></label>
            </div>
          </div>

          <div class="product" data-product="recovery" data-hide-when-staying>
            <label class="product-toggle"><input type="checkbox" name="anc.recovery.on"> Recovery Care</label>
            <div class="product-body grid2">
              <label>Daily benefit ($)<input name="anc.recovery.daily" inputmode="decimal" placeholder="400"></label>
              <label>Premium ($/mo)<input name="anc.recovery.premium" inputmode="decimal" placeholder="107.63"></label>
              <p class="calc" data-calc="recovery"></p>
            </div>
          </div>

          <div class="product" data-product="home" data-hide-when-staying>
            <label class="product-toggle"><input type="checkbox" name="anc.home.on"> Home Healthcare</label>
            <div class="product-body grid2">
              <label>Daily benefit ($)<input name="anc.home.daily" inputmode="decimal" placeholder="150"></label>
              <label>Premium ($/mo)<input name="anc.home.premium" inputmode="decimal"></label>
            </div>
          </div>

          <div class="product" data-product="hospital" data-hide-when-staying>
            <label class="product-toggle"><input type="checkbox" name="anc.hospital.on"> Hospital Indemnity</label>
            <div class="product-body grid3">
              <label>Daily benefit ($)<input name="anc.hospital.daily" inputmode="decimal" placeholder="300"></label>
              <label>SNF daily benefit ($)<input name="anc.hospital.snfDaily" inputmode="decimal" placeholder="150"></label>
              <label>Premium ($/mo)<input name="anc.hospital.premium" inputmode="decimal" placeholder="61.15"></label>
            </div>
          </div>

          <div class="product" data-product="dvh" data-hide-when-staying>
            <label class="product-toggle"><input type="checkbox" name="anc.dvh.on"> Dental, Vision &amp; Hearing</label>
            <div class="product-body grid2">
              <label>Annual max ($)<input name="anc.dvh.annualMax" inputmode="decimal" placeholder="5000"></label>
              <label>Premium ($/mo)<input name="anc.dvh.premium" inputmode="decimal" placeholder="62.13"></label>
            </div>
          </div>
        </div>
      </section>
    </form>

    <aside class="output">
      <div class="toolbar card">
        <div class="subject-row">
          <span class="subject-label">Subject</span>
          <span id="subject" class="subject"></span>
          <button type="button" id="copySubject" class="btn btn-ghost">Copy Subject</button>
        </div>
        <ul id="warnings" class="warnings"></ul>
        <div class="actions">
          <button type="button" id="copyEmail" class="btn btn-primary">Copy Email</button>
          <span id="copyStatus" class="copy-status" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div class="preview-frame">
        <div id="preview" class="preview"></div>
      </div>
    </aside>
  </main>

  <script src="js/config.js"></script>
  <script src="js/email.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
